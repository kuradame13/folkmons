<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folkmons - Folclore Brasileiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="authScreen" class="screen">
        <div class="auth-container">
            <h1>Folkmons</h1>
            <p class="subtitle">Folclore Brasileiro | Scan & Capture</p>
            <p id="cloudBadge" class="cloud-badge" style="display:none;"></p>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('register')">Criar Conta</button>
                <button class="tab-btn" onclick="showTab('changePass')">Trocar Senha</button>
            </div>
            
            <div id="loginTab" class="tab-content active">
                <input type="text" id="loginUsername" placeholder="Usuário" maxlength="20">
                <input type="password" id="loginPassword" placeholder="Senha">
                <button onclick="login()">Entrar</button>
                <p id="loginMsg" class="msg"></p>
            </div>
            
            <div id="registerTab" class="tab-content">
                <input type="text" id="regUsername" placeholder="Usuário (3-20 caracteres)" maxlength="20">
                <input type="email" id="regEmail" placeholder="E-mail" style="display:none;">
                <input type="password" id="regPassword" placeholder="Senha (mín. 4 caracteres)">
                <input type="password" id="regPassword2" placeholder="Confirmar Senha">
                <button onclick="register()">Criar Conta</button>
                <p id="regMsg" class="msg"></p>
            </div>
            
            <div id="changePassTab" class="tab-content">
                <div id="cpPasswordFields">
                    <input type="text" id="cpUsername" placeholder="Usuário">
                    <input type="password" id="cpOldPass" placeholder="Senha Atual">
                    <input type="password" id="cpNewPass" placeholder="Nova Senha (mín. 4 caracteres)">
                    <input type="password" id="cpNewPass2" placeholder="Confirmar Nova Senha">
                    <button onclick="changePassword()">Trocar Senha</button>
                </div>
                <div id="cpResetFields" style="display:none;">
                    <p style="font-size:13px;color:#555;text-align:center;">Digite o e-mail da sua conta para receber um link de redefinição de senha.</p>
                    <input type="email" id="cpEmail" placeholder="E-mail da conta">
                    <button onclick="sendPasswordReset()">Enviar link de redefinição</button>
                </div>
                <p id="cpMsg" class="msg"></p>
            </div>
        </div>
    </div>
    
    <div id="gameScreen" class="screen" style="display:none;">
        <div class="game-header">
            <div class="header-left">
                <span id="playerName"></span> | Nível <span id="playerLevel"></span> | $<span id="playerMoney"></span>
            </div>
            <div class="header-right">
                <button onclick="openMenu('team')">Time</button>
                <button onclick="openMenu('items')">Itens</button>
                <button onclick="openMenu('trades')">Trocas</button>
                <button onclick="openMenu('phone')">📱 Celular</button>
                <button onclick="openChangePassword()">Senha</button>
                <button onclick="logout()">Sair</button>
            </div>
        </div>
        
        <div class="game-container">
            <canvas id="gameMap" width="800" height="600"></canvas>
            <div class="game-ui">
                <div id="locationInfo"><strong>Região:</strong> Sertão Folclórico</div>
            </div>
        </div>
        
        <div id="menuOverlay" class="overlay" style="display:none;">
            <div class="menu-box">
                <div class="menu-header">
                    <h2 id="menuTitle">Menu</h2>
                    <button onclick="closeMenu()">X</button>
                </div>
                <div id="menuContent" class="menu-content"></div>
            </div>
        </div>

        <div id="passwordOverlay" class="overlay" style="display:none;">
            <div class="menu-box" style="max-width:420px;">
                <div class="menu-header">
                    <h2>Trocar Senha</h2>
                    <button onclick="closeChangePassword()">X</button>
                </div>
                <div style="padding:20px; display:flex; flex-direction:column; gap:10px;">
                    <input type="password" id="gameOldPass" placeholder="Senha atual">
                    <input type="password" id="gameNewPass" placeholder="Nova senha">
                    <input type="password" id="gameNewPass2" placeholder="Confirmar nova senha">
                    <button id="gameChangePassBtn" onclick="changePasswordLoggedIn()">Salvar nova senha</button>
                    <p id="gamePassMsg" class="msg"></p>
                </div>
            </div>
        </div>
        
        <div id="battleScreen" class="battle-overlay" style="display:none;">
            <div class="battle-container">
                <div class="battle-top">
                    <div class="enemy-info">
                        <div class="enemy-name"><span id="enemyName"></span> Lv.<span id="enemyLevel"></span></div>
                        <div class="hp-bar"><div id="enemyHpBar" class="hp-fill"></div></div>
                        <div class="hp-text"><span id="enemyHpText"></span></div>
                    </div>
                    <div class="enemy-sprite" id="enemySprite">👾</div>
                </div>
                <div class="battle-bottom">
                    <div class="player-sprite" id="playerSprite">🧍</div>
                    <div class="player-info">
                        <div class="player-name"><span id="battlePlayerName"></span> Lv.<span id="battlePlayerLevel"></span></div>
                        <div class="hp-bar"><div id="playerHpBar" class="hp-fill"></div></div>
                        <div class="hp-text"><span id="playerHpText"></span></div>
                    </div>
                </div>
                <div class="battle-actions">
                    <div id="battleMainActions"></div>
                    <div id="battleLog" class="battle-log"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="folkmons_data.js"></script>
    <script src="vendor/supabase.js"></script>
    <script src="cloud_config.js"></script>
    <script src="cloud_auth.js"></script>
    <script src="game_new.js"></script>
</body>
</html>
